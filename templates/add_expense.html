{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-9 col-lg-7">
        
        <!-- Premium Header area -->
        <div class="card border-0 text-white mb-4 position-relative" style="background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%); border-radius: 1rem; overflow: hidden; box-shadow: 0 10px 30px rgba(236,72,153,0.3);">
            <div class="card-body p-4 p-md-5">
                <i class="fa-solid fa-plus-circle position-absolute" style="font-size: 10rem; right: -25px; bottom: -30px; opacity: 0.15; transform: rotate(-10deg);"></i>
                
                <div class="mb-2">
                    <span class="badge bg-white text-danger mb-3 px-3 py-2 rounded-pill fw-bold shadow-sm" style="font-size: 0.85rem;"><i class="fa-solid fa-pen-to-square me-1"></i>Manual Entry</span>
                    <h2 class="fw-bold mb-2">Log an Expense</h2>
                    <p class="mb-0 opacity-75 fs-6" style="max-width: 80%;">Easily record transactions that don't have a receipt.</p>
                </div>
            </div>
        </div>

        <!-- Input Form -->
        <div class="card border-0 shadow-sm" style="border-radius: 1rem;">
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('add_expense') }}">
                    
                    <div class="row mb-4">
                        <div class="col-md-6 mb-4 mb-md-0">
                            <label class="form-label text-muted fw-bold small text-uppercase spacing-1 mb-2">Date</label>
                            <div class="input-group input-group-lg border rounded-3 px-2 py-1 transition-all focus-ring-group" style="background-color: #f8fafc; border-color: #e2e8f0 !important;">
                                <span class="input-group-text bg-transparent border-0 text-muted"><i class="fa-regular fa-calendar"></i></span>
                                <input type="date" name="date" class="form-control border-0 bg-transparent text-dark px-2" required style="box-shadow: none;">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-muted fw-bold small text-uppercase spacing-1 mb-2">Amount (₹)</label>
                            <div class="input-group input-group-lg border rounded-3 px-2 py-1 transition-all focus-ring-group" style="background-color: #f8fafc; border-color: #e2e8f0 !important;">
                                <span class="input-group-text bg-transparent border-0 text-danger fw-bolder fs-5">₹</span>
                                <input type="number" step="0.01" name="amount" class="form-control border-0 bg-transparent fw-bolder fs-5 text-dark px-2" placeholder="0.00" required style="box-shadow: none;">
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold small text-uppercase spacing-1 mb-2">Vendor / Merchant</label>
                        <div class="input-group input-group-lg border rounded-3 px-2 py-1 transition-all focus-ring-group" style="background-color: #f8fafc; border-color: #e2e8f0 !important;">
                            <span class="input-group-text bg-transparent border-0 text-muted"><i class="fa-solid fa-store"></i></span>
                            <input type="text" name="vendor" class="form-control border-0 bg-transparent text-dark px-2" placeholder="E.g., Starbucks, Amazon, Groceries" required style="box-shadow: none;">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold small text-uppercase spacing-1 mb-2">Category</label>
                        <div class="input-group input-group-lg border rounded-3 px-2 py-1 transition-all focus-ring-group" style="background-color: #f8fafc; border-color: #e2e8f0 !important;">
                            <span class="input-group-text bg-transparent border-0 text-muted"><i class="fa-solid fa-tags"></i></span>
                            <select name="category" class="form-select border-0 bg-transparent text-dark px-2 fw-semibold" style="box-shadow: none;">
                                <option value="Food">🍽️ Food & Dining</option>
                                <option value="Travel">🚗 Travel & Transport</option>
                                <option value="Shopping">🛍️ Shopping</option>
                                <option value="Utilities">💡 Utilities & Bills</option>
                                <option value="Other">📌 Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-5">
                        <label class="form-label text-muted fw-bold small text-uppercase spacing-1 mb-2">Notes (Optional)</label>
                        <div class="input-group border rounded-3 p-2 transition-all focus-ring-group" style="background-color: #f8fafc; border-color: #e2e8f0 !important;">
                            <textarea name="description" class="form-control border-0 bg-transparent text-dark px-2" rows="2" placeholder="Add a quick note to remember this purchase" style="box-shadow: none; resize: none;"></textarea>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-danger btn-lg w-100 py-3 fw-bold rounded-pill shadow-sm d-flex justify-content-center align-items-center gap-2 transition-all hover-lift" style="background: linear-gradient(135deg, #8b5cf6, #ec4899); border: none;">
                        <i class="fa-solid fa-plus-circle"></i> Save Expense
                    </button>
                    
                    <div class="text-center mt-4">
                        <a href="{{ url_for('dashboard') }}" class="text-muted text-decoration-none small hover-primary d-inline-flex align-items-center transition-all fw-semibold"><i class="fa-solid fa-arrow-left me-2"></i>Back to Dashboard</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .spacing-1 { letter-spacing: 1px; }
    .transition-all { transition: all 0.2s ease-in-out; }
    .hover-primary:hover { color: #ec4899 !important; transform: translateX(-3px); }
    .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(236,72,153,0.3) !important; }
    .focus-ring-group:focus-within { border-color: #ec4899 !important; background-color: #fff !important; box-shadow: 0 0 0 4px rgba(236,72,153,0.1); }
</style>
{% endblock %}

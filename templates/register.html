{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <!-- Premium Auth Card -->
        <div class="card border-0 shadow-lg overflow-hidden" style="border-radius: 1.25rem;">
            <!-- Gradient Top Bar -->
            <div style="height: 6px; background: linear-gradient(90deg, #10b981, #0ea5e9);"></div>
            
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex justify-content-center align-items-center bg-success bg-opacity-10 rounded-circle mb-3" style="width: 72px; height: 72px;">
                        <i class="fa-solid fa-user-plus text-success fs-2"></i>
                    </div>
                    <h3 class="fw-bolder text-dark mb-1">Create Account</h3>
                    <p class="text-muted small">Start organizing your expenses intelligently.</p>
                </div>
                
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label text-muted fw-bold small text-uppercase spacing-1">Email or Phone</label>
                        <div class="input-group input-group-lg border rounded-3 px-2 py-1 transition-all focus-ring-group" style="background-color: #f8fafc; border-color: #e2e8f0 !important;">
                            <span class="input-group-text bg-transparent border-0 text-muted"><i class="fa-regular fa-envelope"></i></span>
                            <input type="text" name="username" class="form-control border-0 bg-transparent text-dark px-2" placeholder="Enter your email or phone" required style="box-shadow: none;">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-muted fw-bold small text-uppercase spacing-1 mb-2">Password</label>
                        <div class="input-group input-group-lg border rounded-3 px-2 py-1 transition-all focus-ring-group" style="background-color: #f8fafc; border-color: #e2e8f0 !important;">
                            <span class="input-group-text bg-transparent border-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" name="password" class="form-control border-0 bg-transparent text-dark px-2" placeholder="Create a strong password" required style="box-shadow: none;">
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-success btn-lg w-100 py-3 fw-bold rounded-3 shadow-sm d-flex justify-content-center align-items-center gap-2 transition-all hover-lift" style="background: linear-gradient(135deg, #10b981, #0ea5e9); border: none;">
                        Register Now <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    
                    <div class="position-relative mt-4 mb-4 text-center">
                        <hr class="text-muted opacity-25">
                        <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted fw-semibold">Already have an account?</span>
                    </div>
                    
                    <a href="{{ url_for('login') }}" class="btn btn-light w-100 py-3 fw-bold rounded-3 text-dark border hover-light transition-all rounded-3">
                        Sign In Instead
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    .spacing-1 { letter-spacing: 1px; }
    .transition-all { transition: all 0.2s ease-in-out; }
    .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(16,185,129,0.3) !important; }
    .hover-light:hover { background-color: #f8fafc !important; border-color: #cbd5e1 !important; transform: translateY(-1px); }
    .focus-ring-group:focus-within { border-color: #10b981 !important; background-color: #fff !important; box-shadow: 0 0 0 4px rgba(16,185,129,0.1); }
</style>
{% endblock %}
